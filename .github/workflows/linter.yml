name: Linter

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  build:
    name: '✨ Linter'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Keep the existing required check and run its Go analysis with a Go 1.27-compatible tool.
      # The template's Super-Linter image bundles golangci-lint built with Go 1.25.
      - name: Fetch lint comparison branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Lint Go modules
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=30m --config=./.golangci.yml --fix=false
          only-new-issues: false
